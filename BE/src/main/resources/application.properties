spring.application.name=BE


spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8080}
logging.level.org.springframework.security=DEBUG

spring.profiles.active=dev

# ===== CLEAN LOG =====
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# ===== PAYMENT / VNPAY =====
# Hash secret from VNPay merchant portal (Sandbox/Production)
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.secret=${VNPAY_HASH_SECRET:${payment.vnpay.hash-secret}}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# vnp_ReturnUrl sent to VNPay — MUST hit backend to update DB (not frontend directly)
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-return}
# Where to send user after backend processes return callback
payment.vnpay.frontend-redirect-url=${VNPAY_FRONTEND_REDIRECT_URL:http://localhost:5173/payment/result}
# IPN (server-to-server) — needs public URL (ngrok/Railway); localhost will NOT work from VNPay
payment.vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay-ipn}
payment.vnpay.expire-minutes=${VNPAY_PAYMENT_EXPIRE_MINUTES:15}
payment.expire-cron=${PAYMENT_EXPIRE_CRON:0 */2 * * * *}

# Debug VNPay signature (dev only)
logging.level.com.vsignai.backend.service.impl.VNPayGatewayServiceImpl=DEBUG
logging.level.com.vsignai.backend.service.payment.VNPayIpnService=INFO


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}